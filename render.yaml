services:
  - type: web
    name: nursepath-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
